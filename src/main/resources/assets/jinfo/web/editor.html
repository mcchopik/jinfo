<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JInfo — редактор профиля</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>JInfo — редактор профиля</h1>
  <span id="session" class="session">Соединение…</span>
</header>
<main>
  <section class="editor">
    <textarea id="text" maxlength="500" spellcheck="false"
      placeholder="Привет, я ... {youtube} @nick"></textarea>
    <div class="counter">
      <span id="counter">0 / 500</span>
      <span id="limits"></span>
    </div>
    <div class="toolbar">
      <div class="group" id="colors"></div>
      <div class="group" id="styles"></div>
    </div>
    <div class="group services" id="services"></div>
    <div class="hexrow">
      <input id="hex" placeholder="#RRGGBB" maxlength="7" autocomplete="off">
      <button id="hexbtn" type="button">Hex</button>
    </div>
    <div class="actions">
      <button id="save" type="button" class="primary">Сохранить</button>
      <button id="clear" type="button">Очистить</button>
      <button id="reload" type="button">Обновить</button>
    </div>
    <div id="status" class="status"></div>
  </section>
  <section class="preview">
    <div class="tabs">
      <button class="tab active" data-tab="tooltip" type="button">Подсказка</button>
      <button class="tab" data-tab="full" type="button">Полный профиль</button>
    </div>
    <div id="preview-tooltip" class="pane active"></div>
    <div id="preview-full" class="pane"></div>
    <div id="warnings" class="warnings"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
