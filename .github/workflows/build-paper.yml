name: build-paper

on:
  push:
    branches: [paper]
    tags: ['paper-v*']
  pull_request:
    branches: [paper]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./gradlew build -Pmod_version="${GITHUB_REF_NAME#paper-v}"
          else
            ./gradlew build
          fi

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jinfo-paper
          path: build/libs/jinfo-paper-*.jar
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'paper-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download artifact
        uses: actions/download-artifact@v7
        with:
          name: jinfo-paper
          path: release-artifact

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#paper-v}"
          jar="release-artifact/jinfo-paper-${version}.jar"

          if [ ! -f "${jar}" ]; then
            echo "::error::Expected ${jar}, but the artifact contains:"
            ls -1 release-artifact
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" "${jar}" \
            --title "jinfo-paper ${version}" \
            --generate-notes